<!DOCTYPE html>

<h2 class="text-text-primary dark:text-white text-xl font-bold leading-tight tracking-[-0.015em]">PronounceIt</h2>

<div class="flex items-center gap-2">
<button class="flex h-10 cursor-pointer items-center justify-center overflow-hidden rounded-lg bg-gray-100 dark:bg-gray-700 px-3 text-text-secondary dark:text-gray-300 gap-2 text-sm font-bold leading-normal tracking-[0.015em] hover:bg-gray-200 dark:hover:bg-gray-600">

<span>EN/中文</span>
</button>
<button class="flex h-10 w-10 cursor-pointer items-center justify-center overflow-hidden rounded-lg bg-gray-100 dark:bg-gray-700 text-text-secondary dark:text-gray-300 gap-2 text-sm font-bold leading-normal tracking-[0.015em] hover:bg-gray-200 dark:hover:bg-gray-600">
<span class="material-symbols-outlined text-xl">help_outline</span>
</button>
</div>
</div>
</header>
<main class="mx-auto flex w-full max-w-[1280px] flex-1 flex-grow p-6">
<div class="grid grid-cols-12 gap-6 w-full">
<aside class="col-span-12 md:col-span-4 lg:col-span-3">
<div class="sticky top-6 flex flex-col gap-6">
<div class="flex flex-col gap-3 rounded-xl bg-white dark:bg-gray-800 p-4 shadow-subtle">
<p class="text-text-primary dark:text-gray-100 text-2xl font-bold leading-tight tracking-[-0.033em]">Learn Chinese</p>
<p class="text-text-secondary dark:text-gray-400 text-sm font-normal leading-normal">Enter a Chinese word or phrase to find similar sounding English words.</p>
</div>
<div class="flex flex-col gap-4 rounded-xl bg-white dark:bg-gray-800 p-4 shadow-subtle">
<label class="flex flex-col w-full">
<p class="text-text-primary dark:text-gray-100 text-sm font-medium leading-normal pb-2">Chinese Word or Phrase</p>
<textarea class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-primary dark:text-gray-200 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 min-h-32 placeholder:text-text-secondary dark:placeholder:text-gray-500 p-3 text-base font-normal leading-normal" placeholder="输入中文词语/短句，如“你好”"></textarea>
</label>
<button class="flex min-w-[84px] w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] shadow-subtle hover:bg-blue-600 dark:hover:bg-blue-500 transition-colors">
<span class="truncate">Query</span>
</button>
</div>
<div class="flex flex-col rounded-xl bg-white dark:bg-gray-800 p-4 shadow-subtle">
<h3 class="text-text-primary dark:text-gray-100 text-lg font-bold leading-tight tracking-[-0.015em] pb-3">Recent Queries</h3>
<ul class="flex flex-col gap-1">
<li><a class="block rounded-lg p-2 text-text-secondary dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 dark:hover:text-gray-200 transition-colors" href="#">你好</a></li>
<li><a class="block rounded-lg p-2 text-text-secondary dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 dark:hover:text-gray-200 transition-colors" href="#">谢谢</a></li>
<li><a class="block rounded-lg p-2 text-text-secondary dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 dark:hover:text-gray-200 transition-colors" href="#">我爱你</a></li>
<li><a class="block rounded-lg p-2 text-text-secondary dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 dark:hover:text-gray-200 transition-colors" href="#">中国</a></li>
</ul>
</div>
</div>
</aside>
<section class="col-span-12 md:col-span-8 lg:col-span-9">
<div class="flex h-full items-center justify-center rounded-xl bg-white/50 dark:bg-gray-800/20 border-2 border-dashed border-gray-300 dark:border-gray-700 p-8">
<div class="text-center">
<span class="material-symbols-outlined text-6xl text-gray-400 dark:text-gray-500">search</span>
<h2 class="mt-4 text-xl font-bold text-text-primary dark:text-gray-200">Results will appear here</h2>
<p class="mt-2 text-text-secondary dark:text-gray-400">Enter a phrase on the left to get started.</p>
</div>
</div>
